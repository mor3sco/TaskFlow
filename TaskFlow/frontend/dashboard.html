<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>TaskFlow — Dashboard</title>
<style>
  :root {
    --bg: #0e1424;
    --card: #1a2236;
    --card-border: #2a3450;
    --blue: #2f6fed;
    --text: #f2f4fa;
    --text-dim: #8b93ab;
    --green: #34c77b;
    --red: #ef4b4b;
    --yellow: #f2b84b;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: 'Segoe UI', Arial, sans-serif;
  }
  header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 20px 40px;
    border-bottom: 1px solid var(--card-border);
  }
  .logo { font-size: 22px; font-weight: 700; }
  .logo span { color: var(--blue); }
  nav a {
    color: var(--text-dim);
    text-decoration: none;
    margin-right: 20px;
    font-size: 14px;
  }
  nav a.active { color: var(--text); font-weight: 600; }
  main { padding: 30px 40px; }
  h1 { font-size: 24px; margin-bottom: 24px; }
  .cards {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
    gap: 16px;
    margin-bottom: 30px;
  }
  .card {
    background: var(--card);
    border: 1px solid var(--card-border);
    border-radius: 12px;
    padding: 18px 20px;
  }
  .card .label { color: var(--text-dim); font-size: 13px; }
  .card .value { font-size: 30px; font-weight: 700; margin: 6px 0; }
  .card .change { font-size: 12px; }
  .change.up { color: var(--green); }
  .change.down { color: var(--red); }
  .panel {
    background: var(--card);
    border: 1px solid var(--card-border);
    border-radius: 12px;
    padding: 20px;
  }
  .panel h2 { font-size: 16px; margin: 0 0 16px; }
  .bar-row { margin-bottom: 16px; }
  .bar-row .top { display: flex; justify-content: space-between; font-size: 14px; margin-bottom: 6px; }
  .bar-bg { background: #0e1424; border-radius: 6px; height: 8px; overflow: hidden; }
  .bar-fill { height: 100%; border-radius: 6px; background: var(--blue); }
  .bar-fill.ALTA { background: var(--red); }
  .bar-fill.MEDIA { background: var(--yellow); }
  .bar-fill.BAIXA { background: var(--green); }
  .loading, .error { color: var(--text-dim); padding: 20px; }
</style>
</head>
<body>

<header>
  <div class="logo">Task<span>Flow</span></div>
  <nav>
    <a href="index.html">Tarefas</a>
    <a href="dashboard.html" class="active">Dashboard</a>
  </nav>
</header>

<main>
  <h1>Dashboard</h1>
  <div id="cards" class="cards">
    <div class="loading">Carregando estatísticas...</div>
  </div>

  <div class="panel">
    <h2>Progresso por prioridade</h2>
    <div id="progress"></div>
  </div>
</main>

<script>
const API_URL = 'https://api.oggisec.com/api/dashboard/stats';

function pct(el, value) {
  return `<span class="change ${value >= 0 ? 'up' : 'down'}">${value >= 0 ? '+' : ''}${value}% este mês</span>`;
}

async function loadDashboard() {
  const cardsEl = document.getElementById('cards');
  const progressEl = document.getElementById('progress');

  try {
    const res = await fetch(API_URL, { credentials: 'include' });
    if (!res.ok) throw new Error('Erro ' + res.status);
    const data = await res.json();

    cardsEl.innerHTML = `
      <div class="card">
        <div class="label">Tarefas totais</div>
        <div class="value">${data.totalTarefas.value}</div>
        ${pct(cardsEl, data.totalTarefas.change)}
      </div>
      <div class="card">
        <div class="label">Em andamento</div>
        <div class="value">${data.emAndamento.value}</div>
        ${pct(cardsEl, data.emAndamento.change)}
      </div>
      <div class="card">
        <div class="label">Concluídas</div>
        <div class="value">${data.concluidas.value}</div>
        ${pct(cardsEl, data.concluidas.change)}
      </div>
      <div class="card">
        <div class="label">Prazo próximo</div>
        <div class="value">${data.prazoProximo.value}</div>
      </div>
    `;

    const labels = { ALTA: 'Alta prioridade', MEDIA: 'Média prioridade', BAIXA: 'Baixa prioridade' };
    progressEl.innerHTML = data.progressByPriority.map(p => `
      <div class="bar-row">
        <div class="top"><span>${labels[p.priority]}</span><span>${p.percent}%</span></div>
        <div class="bar-bg"><div class="bar-fill ${p.priority}" style="width:${p.percent}%"></div></div>
      </div>
    `).join('');

  } catch (err) {
    cardsEl.innerHTML = `<div class="error">Não foi possível carregar o dashboard. ${err.message}</div>`;
    console.error(err);
  }
}

loadDashboard();
</script>

</body>
</html>
